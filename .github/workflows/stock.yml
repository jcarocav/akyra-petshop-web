# Actualiza stock.json (y productos.json si hay productos nuevos) desde la
# planilla "Akyra · Stock web" cada hora. Si la planilla o Google fallan, o el
# CSV no pasa la validación, no se cambia nada: el sitio queda con el último
# stock bueno. Para revisar: pestaña "Actions" de GitHub → "Stock desde la planilla".
name: Stock desde la planilla

on:
  schedule:
    - cron: '17 * * * *'   # cada hora, al minuto 17 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # No necesita instalar dependencias: solo usa Node
      - name: Descargar y validar el CSV de la planilla
        env:
          STOCK_CSV_URL: ${{ secrets.STOCK_CSV_URL }}
        run: node tools/stock/actualizar-desde-sheet.mjs
      - name: Regenerar sitemap (solo productos visibles)
        run: node tools/construir-paginas.mjs
      - name: Guardar cambios (solo si algo cambió)
        run: |
          if git diff --quiet -- stock.json productos.json sitemap.xml; then
            echo "Sin cambios de stock."
            exit 0
          fi
          git config user.name "akyra-stock-bot"
          git config user.email "akyra-stock-bot@users.noreply.github.com"
          git add stock.json productos.json sitemap.xml
          git commit -m "Stock actualizado desde la planilla ($(date -u +'%Y-%m-%d %H:%M') UTC)"
          git push
