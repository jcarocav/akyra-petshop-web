# Corre TODAS las pruebas en cada push y pull request: lint, HTML, Playwright
# (Chrome, Firefox y WebKit en escritorio y celular, con axe-core), enlaces
# rotos y Lighthouse. Los commits automáticos de stock no las disparan.
name: Pruebas

on:
  push:
    paths-ignore: ['stock.json', 'sitemap.xml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A veces la descarga de paquetes de Ubuntu (apt) se queda pegada: tiempos de espera
      # cortos, máximo 8 minutos por intento y, antes de reintentar, se corta el apt colgado.
      - name: Instalar dependencias de los navegadores
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nDPkg::Lock::Timeout "120";\n' | sudo tee /etc/apt/apt.conf.d/99akyra > /dev/null
          ok=0
          for i in 1 2 3; do
            if timeout -k 10 480 npx playwright install-deps chromium firefox webkit; then ok=1; break; fi
            echo "Intento $i falló, reintentando..."
            sudo pkill -9 -f 'apt-get|dpkg' || true
            sudo dpkg --configure -a || true
          done
          [ "$ok" = 1 ]
      - name: Instalar navegadores
        run: |
          for i in 1 2 3; do timeout -k 10 480 npx playwright install chromium firefox webkit && exit 0; echo "Intento $i falló"; done
          exit 1
      - name: Lint (JavaScript)
        run: npm run lint
      - name: Validar HTML
        run: npm run html
      - name: Pruebas (unidad + navegador)
        run: npm test
      - name: Enlaces e imágenes rotas
        run: npm run enlaces
      - name: Lighthouse (celular)
        run: npm run lighthouse
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 7
